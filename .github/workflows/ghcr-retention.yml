name: GHCR retention

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

permissions:
  packages: write
  contents: read

jobs:
  prune:
    name: Prune old GHCR versions
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-cleanup-${{ github.repository }}
    steps:
      # dataaxiom is multi-arch + sigstore aware: it keeps the manifest list and
      # its child images/attestations together. Do NOT swap for
      # actions/delete-package-versions, which orphans cosign/SBOM referrers.
      - name: Prune GHCR (keep latest + 5 most recent tagged)
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          keep-n-tagged: 5
          exclude-tags: latest
          delete-untagged: true
