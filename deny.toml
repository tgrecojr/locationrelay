# cargo-deny configuration. Run with `cargo deny check`.

[advisories]
# Known vulnerabilities and unsound crates are always denied by cargo-deny
# (0.16+); we additionally fail on *any* unmaintained crate (not just workspace
# members) and on yanked releases. Stated explicitly so the gate stays strict.
unmaintained = "all"
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcard-dependencies = "deny"

[licenses]
# Allow common permissive licenses used across the Rust ecosystem.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
